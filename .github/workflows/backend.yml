name: backend
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
defaults:
  run:
    working-directory: backend
# Supply chain: the actions below are pinned by major tag (first-party / well-known publishers).
# Before production, pin each `uses:` to a full commit SHA (Dependabot can keep them current).
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: habi
          POSTGRES_PASSWORD: habi
          POSTGRES_DB: habi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U habi" --health-interval 5s --health-timeout 5s
          --health-retries 10
      # Real Redis: the QR "spent" fast path and the scan / invitation counters depend on TTL and
      # INCR semantics that fakeredis cannot prove (tests marked `redis`).
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # Real PostGIS in CI: postgis-marked tests must run, never be skipped (see tests/conftest.py).
      TEST_DATABASE_URL: postgis://habi:habi@localhost:5432/habi
      REQUIRE_POSTGIS: "1"
      REDIS_TEST_URL: redis://localhost:6379/1
      REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      # ubuntu-latest (24.04) ships libgdal 3.8.x; Django 5.2 supports GDAL 3.1 - 3.10. If the
      # runner image moves to a GDAL newer than 3.10, pin the image or install GDAL explicitly.
      - name: Install GDAL/GEOS (GeoDjango)
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
      - run: pip install -r requirements/dev.txt
      # Known-vulnerable dependencies in what ships (prod.txt pulls in base.txt).
      - name: pip-audit (production requirements)
        run: pip install pip-audit && pip-audit -r requirements/prod.txt --strict
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations are in sync with models
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run
      # Everything except the slow concurrency tests first: a plain failure shows up in minutes.
      - name: pytest (unit, API, SQL and real Redis)
        timeout-minutes: 10
        run: pytest -m "not postgis" -p no:cacheprovider
      # The PostgreSQL race / lock / migration tests (50 threads per case): own step, own budget,
      # and pytest-timeout (120 s per test, pyproject.toml) turns a hang into a failure.
      - name: pytest (PostgreSQL concurrency, constraints, migrations)
        timeout-minutes: 20
        run: pytest -m postgis -p no:cacheprovider
      - name: OpenAPI schema has no warnings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py spectacular --fail-on-warn --file /dev/null
      - name: Deploy checks (prod settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          # CI-only throwaway values; >=50 chars and >=5 unique chars to satisfy security.W009.
          SECRET_KEY: ci-only-throwaway-key-abcdefghijklmnopqrstuvwxyz-0123456789-ABCDEFGHIJ
          QR_SIGNING_KEY: ci-only-throwaway-qr-key-abcdefghijklmnopqrstuvwxyz-0123456789-ABCDEFGH
          ALLOWED_HOSTS: api.parkbor.uz
          DATABASE_URL: postgis://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          # Every other variable prod.py requires, with throwaway values of the right length.
          JWT_SIGNING_KEY: ci-only-throwaway-jwt-key-abcdefghijklmnopqrstuvwxyz-0123456789
          TELEGRAM_BOT_TOKEN: "123456:CI-ONLY-THROWAWAY-TOKEN"
          TELEGRAM_BOT_USERNAME: ParkBorCiBot
          TELEGRAM_WEBHOOK_SECRET: ci-only-throwaway-webhook-secret-0123456789
          PAYME_MERCHANT_ID: ci0merchant0id0000000000
          PAYME_KEY: ci-only-throwaway-payme-key-0123456789ab
          CLICK_SERVICE_ID: "100"
          CLICK_MERCHANT_ID: "200"
          CLICK_MERCHANT_USER_ID: "300"
          CLICK_SECRET_KEY: ci-only-click-secret-0123
          # Documentation range: keeps payments.W001 (no IP allowlist) quiet.
          PAYMENTS_PROVIDER_IPS: 203.0.113.0/24
        run: python manage.py check --deploy --fail-level WARNING

  # The image that production runs. Built (not pushed) on every backend change; a registry push
  # step belongs to the release workflow once the registry is chosen (docs/DEPLOY.md).
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          push: false
          tags: parkbor-backend:ci
          build-args: RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image smoke test (GDAL, ASGI server, Celery import)
        run: |
          docker run --rm parkbor-backend:ci python -c "from django.contrib.gis import gdal; import uvicorn, celery, sentry_sdk, argon2; print('gdal', gdal.gdal_version())"
          test "$(docker run --rm parkbor-backend:ci id -u)" != "0"
