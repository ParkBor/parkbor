name: mobile
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths: ["mobile/**", "packages/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".npmrc", ".nvmrc", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "packages/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".npmrc", ".nvmrc", ".github/workflows/mobile.yml"]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mobile lint
      # Generates .expo/types (typed routes) and expo-env.d.ts that tsconfig includes.
      - run: pnpm --filter mobile exec expo customize tsconfig.json
      - run: pnpm --filter mobile typecheck
      - run: pnpm --filter mobile test
      - run: pnpm --filter "./packages/*" typecheck
