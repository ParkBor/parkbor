[project]
name = "habi-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
"config/settings/dev.py" = ["S105"]
"config/settings/test.py" = ["S105"]
"**/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "function"
# 120 s per test (the 50-thread PostgreSQL tests are the slowest); thread method so a test stuck in
# a database call is reported with its stack instead of hanging the worker.
timeout = 120
timeout_method = "thread"
markers = [
    "postgis: needs GDAL/GEOS and a real PostGIS database (auto-skipped otherwise)",
    "redis: needs a real Redis (REDIS_TEST_URL); auto-skipped otherwise, mandatory in CI",
]
