# ParkBor CRM static server (Railway). Runs as the unprivileged `nginx` user; TLS is terminated by
# Railway's edge, so this only speaks plain HTTP on $PORT (rendered in conf.d/crm.conf).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 1k;   # static site: no uploads
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # $uri, never $request/$args: no query string in the logs.
    log_format parkbor '$remote_addr [$time_iso8601] $host "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent rt=$request_time';
    access_log /dev/stdout parkbor;

    include /etc/nginx/conf.d/*.conf;
}
