name: parkbor

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habi}
      POSTGRES_USER: ${POSTGRES_USER:-habi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habi} -d ${POSTGRES_DB:-habi}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # >= 6.2 is required (GETDEL). noeviction: this server holds the Celery broker, the WebSocket
    # channel layer and application state (tickets, registries); evicting a key would silently
    # lose a queued task or a ticket. A production cache belongs on a separate allkeys-lru server
    # (CACHE_REDIS_URL, ARCHITECTURE 17).
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    profiles: ["backend"]
    # One ASGI process serves HTTP and WebSocket, like production (runserver has no WebSocket).
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload --lifespan off
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgis://${POSTGRES_USER:-habi}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-habi}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-placeholder}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery: one worker per queue in production (see ARCHITECTURE 17); a single one is enough here.
  celery:
    build:
      context: ../backend
    profiles: ["backend"]
    command: celery -A config worker -l info -Q celery,realtime,notify --prefetch-multiplier 1
    environment: &backend_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgis://${POSTGRES_USER:-habi}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-habi}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-placeholder}
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ../backend
    profiles: ["backend"]
    command: celery -A config beat -l info
    environment: *backend_env
    volumes:
      - ../backend:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
