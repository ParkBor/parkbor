# Habi edge nginx (ARCHITECTURE 14.3, 15, 17). Runs as the unprivileged `nginx` user, so every
# path below is writable by it and the ports are >1024 (host maps 80->8080, 443->8443).
#
# TLS terminates HERE: certificates are mounted at /etc/nginx/certs/<domain>/ (see habi.conf.template).
# Real client IP: nginx faces the internet directly, so $remote_addr is the client. If a CDN or
# load balancer is ever put in front, add `set_real_ip_from <its CIDR>; real_ip_header
# X-Forwarded-For;` below AND revisit NUM_PROXIES / the payment IP allowlist in the backend.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    # Default for ordinary API calls; /ws/ and webhooks override it.
    client_max_body_size 1m;

    # Access log WITHOUT the query string: $uri (never $request, $request_uri or $args), so a
    # WebSocket ?ticket= or any other query secret is not written to disk. The Referer header
    # is deliberately omitted too. (The error log can still echo a request line on upstream
    # errors; tickets are one-time and live 30 s, see docs/DEPLOY.md.)
    log_format habi '$remote_addr [$time_iso8601] $host "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
                    'ua="$http_user_agent"';
    access_log /dev/stdout habi;

    # ---- rate limiting (per client IP) ----------------------------------------------------
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_zone  $binary_remote_addr zone=api_general:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api_auth:10m      rate=10r/m;   # /auth/telegram/*
    # Only POST /bookings is counted (an empty key is not limited): reads stay on api_general.
    map $request_method $booking_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone  $booking_key zone=api_booking:10m          rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=api_wsticket:10m  rate=60r/m;   # app limit is 30/min
    limit_req_zone  $binary_remote_addr zone=webhooks:10m      rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # WebSocket upgrade: "upgrade" only for real upgrade requests, keep-alive otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream asgi {
        server api:8000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
