# Reverse proxy to the ASGI app. X-Forwarded-For is OVERWRITTEN with the TCP peer (never appended
# to what the client sent): NUM_PROXIES=1, the payment IP allowlist and throttling rely on it
# (ARCHITECTURE 17). X-Forwarded-Proto is fixed to https: TLS ends here and Django's
# SECURE_SSL_REDIRECT must not loop.
proxy_pass http://asgi;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Real-IP $remote_addr;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_redirect off;
