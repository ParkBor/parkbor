# Headers for every response. Included in each location that adds its own add_header (nginx does
# not inherit add_header into a location that declares one).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# allow-popups, not same-origin: the Telegram Login Widget runs in a popup and answers via window.opener.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
